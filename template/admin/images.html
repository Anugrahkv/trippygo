                        <div class="panel-body">

                                <form class="cmxform form-horizontal " id="signupForm" method="POST" action="/images/"  enctype="multipart/form-data" >
                                    {% csrf_token %}

                                    </div>
                                    <div class="form-group ">

                                        <div class="col-lg-3">
                                            <input class="form-control " id="image3" name="image3" type="file" required>
                                        </div>
                                    </div>
                                     <div class="form-group " id="tutorial" >

                                        <div class="col-lg-6">
                                    
                                            <select class="form-control" name="destination" id='specialcategory'>
                                            <option  value="">Select DESTINATION</option>
                                            {% for x in destinationname %}
                                            <option value="{{x.id}}">{{x.destination}}</option>
                                            {% endfor %}
                                        </select>
                                        </div>
                                        
                                    </div>

                                            <button class="btn btn-default" type="button">Cancel</button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </section>
                </div>

</section>
